name: Ghost Blog Advance CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ghostblock/ghostblog-advanced.yml'

jobs:
  deploy-to-advance-k8s:
    name: Deploy to Morpheus Advance K8s
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Ghost YAML
        run: |
          echo "=== Applying YAML to Morpheus Advance Cluster ==="
          kubectl apply -f ghostblock/ghostblog-advanced.yml

      - name: Verify Pods
        run: |
          echo "=== Morpheus Advance Pod Status ==="
          kubectl get pods -n demo
