name: Ghost Blog Advance CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ghostblock/ghostblog-advanced.yaml'

jobs:
  deploy-to-advance-k8s:
    name: Deploy to Morpheus Advance K8s
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Ghost YAML
        run: |
          Write-Host "=== Applying YAML to Morpheus Advance Cluster ==="
          kubectl apply -f ghostblock/ghostblog-advanced.yaml
          
      - name: Verify Pods
        run: |
          Write-Host "=== Morpheus Advance Pod Status ==="
          kubectl get pods -n demo
